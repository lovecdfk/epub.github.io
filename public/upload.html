<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload EPUB - EPUB Reader</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo"><i class="fas fa-book-reader"></i> EPUB Reader</h1>
            <ul class="nav-menu">
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="library.html"><i class="fas fa-book"></i> Library</a></li>
                <li><a href="upload.html" class="active"><i class="fas fa-upload"></i> Upload</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="upload-container">
            <h1><i class="fas fa-cloud-upload-alt"></i> Upload EPUB Book</h1>
            <p>Upload your EPUB file to start reading. Max file size: 50MB</p>
            
            <div class="upload-area" id="dropArea">
                <i class="fas fa-file-upload upload-icon"></i>
                <p>Drag & drop your EPUB file here</p>
                <p class="upload-subtext">or</p>
                <label for="fileInput" class="btn btn-primary">
                    <i class="fas fa-folder-open"></i> Browse Files
                </label>
                <input type="file" id="fileInput" accept=".epub" style="display: none;">
            </div>
            
            <div class="upload-form">
                <div class="form-group">
                    <label for="bookTitle"><i class="fas fa-heading"></i> Book Title</label>
                    <input type="text" id="bookTitle" placeholder="Enter book title">
                </div>
                
                <div class="form-group">
                    <label for="bookAuthor"><i class="fas fa-user"></i> Author</label>
                    <input type="text" id="bookAuthor" placeholder="Enter author name">
                </div>
                
                <div class="form-group">
                    <label for="bookDescription"><i class="fas fa-align-left"></i> Description (Optional)</label>
                    <textarea id="bookDescription" rows="3" placeholder="Enter book description"></textarea>
                </div>
                
                <button id="uploadBtn" class="btn btn-primary btn-large" disabled>
                    <i class="fas fa-upload"></i> Upload Book
                </button>
                
                <div id="uploadProgress" class="progress-container" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p id="progressText">Uploading...</p>
                </div>
                
                <div id="uploadMessage" class="message"></div>
            </div>
            
            <div class="uploaded-files">
                <h3>Recently Uploaded</h3>
                <div id="uploadedBooks" class="book-list">
                    <!-- Uploaded books will appear here -->
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2023 EPUB Reader. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
